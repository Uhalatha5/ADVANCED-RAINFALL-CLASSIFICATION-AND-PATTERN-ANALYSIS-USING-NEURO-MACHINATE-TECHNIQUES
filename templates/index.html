{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Rainfall Prediction & Classification</h2>

<div class="card shadow p-4">

<form action="/predict" method="post">

<div class="row">
    {% for feature in features %}
        <div class="col-md-3 mb-3">
            <label class="form-label">{{ feature }}</label>
            <input type="number" step="any" name="{{ feature }}" class="form-control" required>
        </div>
    {% endfor %}
</div>

<button type="submit" class="btn btn-success mt-3">Predict</button>

</form>

</div>

{% if rainfall %}
<div class="alert alert-info mt-4">
    <h4>Predicted Rainfall: {{ rainfall }} mm</h4>
    <h4>Category: {{ category }}</h4>
</div>
{% endif %}

{% endblock %}
